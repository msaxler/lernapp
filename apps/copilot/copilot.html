<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Copilot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0e0f11;
  color: #e2e8f0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Setup ─────────────────────────────────────── */
#setup {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  padding: 2rem 1.5rem;
  min-height: 100dvh;
}
.setup-logo { font-size: 2rem; }
.setup-title { font-size: 1.2rem; font-weight: 700; color: #8b5cf6; }
.setup-hint  { font-size: 0.82rem; color: #64748b; text-align: center; max-width: 300px; line-height: 1.5; }

input[type=password] {
  width: 100%; max-width: 340px;
  background: #161822; border: 1px solid #2d3148; border-radius: 0.75rem;
  padding: 0.875rem 1rem; color: #e2e8f0; font-size: 0.9rem; text-align: center;
}
input:focus { outline: none; border-color: #8b5cf6; }

.btn-primary {
  width: 100%; max-width: 340px;
  background: #8b5cf6; color: white; border: none;
  border-radius: 0.75rem; padding: 0.875rem;
  font-size: 1rem; font-weight: 600; cursor: pointer;
}
.btn-primary:active { background: #7c3aed; }
.err { color: #f87171; font-size: 0.8rem; text-align: center; min-height: 1rem; }

/* ── Main ───────────────────────────────────────── */
#main { display: flex; flex-direction: column; min-height: 100dvh; }

header {
  padding: 0.875rem 1.25rem 0.75rem;
  border-bottom: 1px solid #1a1c2e;
  flex-shrink: 0;
}
.hrow { display: flex; justify-content: space-between; align-items: center; }

h1 { font-size: 0.95rem; font-weight: 600; color: #8b5cf6; }

.badge {
  font-size: 0.7rem; padding: 0.2rem 0.6rem;
  border-radius: 999px; font-weight: 600;
}
.ok   { background: #14532d33; color: #4ade80; border: 1px solid #166534; }
.warn { background: #78350f33; color: #fbbf24; border: 1px solid #92400e; }
.late { background: #7f1d1d33; color: #f87171; border: 1px solid #991b1b; }

.status-meta { font-size: 0.68rem; color: #475569; margin-top: 0.25rem; }

.tabs { display: flex; gap: 0.4rem; margin-top: 0.6rem; }
.tab {
  flex: 1; padding: 0.35rem 0.5rem;
  border-radius: 0.5rem; border: 1px solid #2d3148;
  background: transparent; color: #475569;
  font-size: 0.72rem; cursor: pointer; text-align: center;
  transition: all 0.15s;
}
.tab.active { background: #1a1c2e; color: #8b5cf6; border-color: #8b5cf6; }

/* ── Answer area ────────────────────────────────── */
#answers {
  flex: 1; overflow-y: auto;
  padding: 1rem 1.25rem;
  display: flex; flex-direction: column; gap: 0.6rem;
}

.hint {
  color: #334155; font-size: 0.875rem;
  text-align: center; padding: 3rem 0;
  line-height: 1.6;
}
.spinning {
  color: #8b5cf6; font-size: 0.875rem;
  text-align: center; padding: 2rem 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 1.1rem; height: 1.1rem;
  border: 2px solid #2d3148; border-top-color: #8b5cf6;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 0.4rem;
}

.q-block {
  background: #0e1020; border-left: 3px solid #8b5cf6;
  border-radius: 0 0.6rem 0.6rem 0;
  padding: 0.65rem 0.875rem;
}
.q-block p { font-size: 0.85rem; color: #94a3b8; font-style: italic; }

.a-block {
  background: #161822; border-radius: 0.65rem;
  padding: 0.75rem 0.875rem;
}
.a-label {
  font-size: 0.65rem; font-weight: 700; color: #8b5cf6;
  text-transform: uppercase; letter-spacing: 0.08em;
  margin-bottom: 0.35rem;
}
.a-text { font-size: 0.875rem; line-height: 1.55; color: #cbd5e1; }

/* ── Footer ─────────────────────────────────────── */
footer {
  border-top: 1px solid #1a1c2e;
  padding: 0.6rem 0.875rem 0.6rem;
  display: flex; gap: 0.5rem; align-items: flex-end;
  flex-shrink: 0;
}
textarea {
  flex: 1;
  background: #161822; border: 1px solid #2d3148;
  border-radius: 0.75rem;
  padding: 0.65rem 0.875rem;
  color: #e2e8f0; font-size: 0.875rem; font-family: inherit;
  resize: none; min-height: 2.75rem; max-height: 7rem;
  line-height: 1.4;
}
textarea:focus { outline: none; border-color: #8b5cf6; }
#send {
  background: #8b5cf6; color: white; border: none;
  border-radius: 0.75rem; width: 2.75rem; height: 2.75rem;
  font-size: 1.25rem; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
#send:disabled { background: #1e2030; cursor: default; }
#send:active:not(:disabled) { background: #7c3aed; }
</style>
</head>
<body>

<!-- ── Main ── -->
<div id="main">
  <header>
    <div class="hrow">
      <h1 id="proj-name">Copilot</h1>
      <span id="badge" class="badge ok">lädt…</span>
    </div>
    <div id="meta" class="status-meta">STATUS.md wird geladen…</div>
    <div class="tabs">
      <button class="tab active" onclick="switchProj('lernapp', this)">LernApp</button>
      <button class="tab"        onclick="switchProj('p2f2',    this)">P2F2</button>
    </div>
  </header>

  <div id="answers">
    <div class="hint">Stell eine Frage zum Projekt.<br><span style="font-size:0.75rem">z.B. „Was ist als nächstes zu tun?"</span></div>
  </div>

  <footer>
    <textarea id="q" placeholder="Deine Frage…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();ask();}"></textarea>
    <button id="send" onclick="ask()">↑</button>
  </footer>
</div>

<script>
// ── Projekte ──────────────────────────────────────────────────────────────
const PROJ = {
  lernapp: {
    name: 'LernApp',
    url: 'https://raw.githubusercontent.com/msaxler/lernapp/main/apps/quizaway/STATUS.md',
    s1: 3, s2: 10
  },
  p2f2: {
    name: 'P2F2',
    url: 'https://raw.githubusercontent.com/msaxler/geoclaude/main/docs/konzepte/P2F2-STATUS.md',
    s1: 7, s2: 21,
    pending: true  // noch kein STATUS.md vorhanden
  }
};

let cur      = 'lernapp';
let statusMd = '';

// ── Init ──────────────────────────────────────────────────────────────────
window.onload = () => loadStatus();

// ── Tab-Wechsel ───────────────────────────────────────────────────────────
function switchProj(id, el) {
  cur = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('proj-name').textContent = PROJ[id].name + ' Copilot';
  statusMd = '';
  document.getElementById('meta').textContent = 'STATUS.md wird geladen…';
  document.getElementById('badge').textContent = '…';
  document.getElementById('answers').innerHTML =
    '<div class="hint">Stell eine Frage zum Projekt.</div>';
  loadStatus();
}

// ── STATUS.md laden ───────────────────────────────────────────────────────
async function loadStatus() {
  const p = PROJ[cur];

  if (p.pending) {
    document.getElementById('meta').textContent = 'Onboarding nach LernApp-Pilot (14 Tage)';
    document.getElementById('badge').className = 'badge warn';
    document.getElementById('badge').textContent = 'bald';
    document.getElementById('answers').innerHTML =
      '<div class="hint">P2F2-Copilot startet nach Abschluss des LernApp-Pilots.<br>' +
      '<span style="font-size:0.75rem">Voraussichtlich nach dem 20.05.2026.</span></div>';
    return;
  }

  try {
    const r = await fetch(p.url + '?_=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    statusMd = await r.text();
    updateBadge();
  } catch (e) {
    document.getElementById('meta').textContent = 'STATUS.md nicht erreichbar — ' + e.message;
    document.getElementById('badge').className = 'badge late';
    document.getElementById('badge').textContent = 'offline';
  }
}

function updateBadge() {
  const p    = PROJ[cur];
  const mB   = statusMd.match(/Bestätigt:\s*(\d{4}-\d{2}-\d{2})/);
  const mG   = statusMd.match(/Geändert:\s*(\d{4}-\d{2}-\d{2})/);
  const badge = document.getElementById('badge');
  const meta  = document.getElementById('meta');

  if (!mB) {
    badge.className = 'badge warn'; badge.textContent = '?';
    meta.textContent = 'Kein Bestätigt-Datum';
    return;
  }

  const n = Math.floor((Date.now() - new Date(mB[1])) / 86400000);
  let cls, txt;
  if      (n <= p.s1) { cls = 'ok';   txt = `✓ ${mB[1]}`; }
  else if (n <= p.s2) { cls = 'warn'; txt = `${n}d nicht bestätigt`; }
  else                { cls = 'late'; txt = `${n}d nicht bestätigt`; }

  badge.className = 'badge ' + cls;
  badge.textContent = txt;
  meta.textContent = `Bestätigt: ${mB[1]}${mG ? '  ·  Geändert: ' + mG[1] : ''}`;
}

// ── Frage stellen ─────────────────────────────────────────────────────────
async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;

  if (!statusMd) { alert('STATUS.md noch nicht geladen — bitte kurz warten.'); return; }

  const p   = PROJ[cur];
  const btn = document.getElementById('send');
  btn.disabled = true;

  const area = document.getElementById('answers');
  area.innerHTML =
    `<div class="q-block"><p>${esc(q)}</p></div>` +
    `<div class="spinning"><span class="spinner"></span>Denkt nach…</div>`;

  const sys = `Du bist ein Copilot für das Projekt "${p.name}".

Beantworte jede Frage mit genau dieser Struktur — ohne Abweichung:

1. KURZANTWORT: [1–2 Sätze, konkreter Inhalt]
2. KONTEXT: [Projekt / Modul / Phase / Zeitpunkt]
3. QUELLEN: [Primärquelle aus STATUS.md — ADR, Konzept-Nr., Vault-ID]
4. EMPFEHLUNG: [Konkreter nächster Schritt]
5. UNSICHERHEIT: [Nur wenn Bestätigt > ${p.s1} Tage alt — sonst genau: –]

Wichtig: Du machst keine Aussage darüber ob der Stand veraltet IST — nur ob die Bestätigung fehlt.

Aktueller Projektstatus (STATUS.md):
---
${statusMd}
---`;

  try {
    const res = await fetch('/api/copilot', {
      method: 'POST',
      headers: {
        'content-type': 'application/json'
      },
      body: JSON.stringify({
        model: 'claude-haiku-4-5-20251001',
        max_tokens: 800,
        system: sys,
        messages: [{ role: 'user', content: q }]
      })
    });

    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.error?.message || 'HTTP ' + res.status);
    }

    const data = await res.json();
    render(q, data.content[0].text, area);
    document.getElementById('q').value = '';

  } catch (e) {
    area.innerHTML =
      `<div class="q-block"><p>${esc(q)}</p></div>` +
      `<div class="a-block"><div class="a-label">Fehler</div>` +
      `<div class="a-text" style="color:#f87171">${esc(e.message)}</div></div>`;
  }

  btn.disabled = false;
}

// ── Antwort rendern ───────────────────────────────────────────────────────
const SECTIONS = [
  ['1. KURZANTWORT', 'Kurzantwort'],
  ['2. KONTEXT',     'Kontext'],
  ['3. QUELLEN',     'Quellen'],
  ['4. EMPFEHLUNG',  'Empfehlung'],
  ['5. UNSICHERHEIT','Unsicherheit'],
];

function render(q, raw, area) {
  let html = `<div class="q-block"><p>${esc(q)}</p></div>`;

  for (let i = 0; i < SECTIONS.length; i++) {
    const [key, label] = SECTIONS[i];
    const nextKey = SECTIONS[i + 1]?.[0];

    let s = raw.indexOf(key);
    if (s === -1) continue;
    s = raw.indexOf(':', s) + 1;

    let e = nextKey ? raw.indexOf(nextKey) : raw.length;
    if (e === -1) e = raw.length;

    const txt = raw.slice(s, e).trim();
    if (!txt || txt === '–' || txt === '-') continue;

    html += `<div class="a-block">
      <div class="a-label">${label}</div>
      <div class="a-text">${esc(txt)}</div>
    </div>`;
  }

  area.innerHTML = html;
  area.scrollTop = 0;
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
          .replace(/\n/g,'<br>');
}
</script>
</body>
</html>
