<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuizAway Reise-Prototyp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
/* Feldtest-Prototyp Reise-Modus (Spielkonzept v0.2.8, UI-Konzept v0.2). Aussehen aus der Skizze v0.2:
   Ortsschild-Gelb, Hell und Dunkel; Auto-Screens mit festen Maßen (R-UI-18), Bahn/Solo wächst mit der Systemschrift. */
:root{
  --bg:#fbfbf9; --fg:#171a1f; --muted:#5c6878; --line:#cfd6df; --surface:#ffffff;
  --accent:#f6c700; --accent-fg:#1b1b1b; --plate-edge:#1b1b1b;
  --spine:#2b4b6f; --spine-soft:#dbe6f2; --strong:#171a1f;
  --idle-bg:#fbfbf9; --idle-fg:#171a1f; --idle-muted:#5c6878;
  --ok:#1f7a45; --no:#a33a2b;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1b1f24; --fg:#eef1f5; --muted:#9aa7b8; --line:#39424e; --surface:#242a31;
  --accent:#f6c700; --accent-fg:#1b1b1b; --plate-edge:#0b0d10;
  --spine:#8fb4dc; --spine-soft:#243448; --strong:#eef1f5;
  --idle-bg:#0c0e11; --idle-fg:#aab4c0; --idle-muted:#6c7785; --ok:#6fd09a; --no:#f08a7a; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1b1f24; --fg:#eef1f5; --muted:#9aa7b8; --line:#39424e; --surface:#242a31;
  --accent:#f6c700; --accent-fg:#1b1b1b; --plate-edge:#0b0d10;
  --spine:#8fb4dc; --spine-soft:#243448; --strong:#eef1f5;
  --idle-bg:#0c0e11; --idle-fg:#aab4c0; --idle-muted:#6c7785; --ok:#6fd09a; --no:#f08a7a; color-scheme:dark }

html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);display:flex;justify-content:center}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--spine);outline-offset:2px}
.stage{width:100%;max-width:480px;height:100%;position:relative}
.scr{position:absolute;inset:0;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;padding:16px 16px calc(16px + env(safe-area-inset-bottom));gap:10px;overflow:auto}
.scr[hidden]{display:none}
.grow{flex:1 1 auto;min-height:0}
.top{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.top .sp{flex:1}
.top button{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-weight:700;font-size:12px}

.plate{align-self:flex-start;background:var(--accent);color:var(--accent-fg);border:3px solid var(--plate-edge);border-radius:6px;padding:4px 10px;font-family:var(--display);font-weight:700;line-height:1.2}
.meta{color:var(--muted);line-height:1.4}
.q{font-family:var(--display);font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.hint{color:var(--muted);line-height:1.3}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%;border:2px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;line-height:1.3}
.opt .k{position:relative;flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--spine-soft);color:var(--spine)}
.opt[aria-pressed="true"]{border-color:var(--strong)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-fg)}
.bar{display:flex;gap:8px;flex:0 0 auto}
.btn{flex:1;min-height:56px;border:2px solid var(--line);border-radius:14px;font-weight:700;display:grid;place-items:center;text-align:center;padding:6px 10px;line-height:1.2}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--plate-edge)}
.btn.quiet{color:var(--muted)}
.btn.small{flex:0 0 auto;min-height:44px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}

.auto .plate{font-size:20px} .auto .meta{font-size:15px} .auto .q{font-size:24px} .auto .hint{font-size:15px}
.auto .opt{min-height:72px;font-size:20px} .auto .btn{font-size:20px} .auto .quote,.auto .story,.auto .conn{font-size:20px}
.rail{font-size:1rem} .rail .plate{font-size:1.25rem} .rail .meta{font-size:.9rem} .rail .q{font-size:1.375rem}
.rail .opt{min-height:56px;font-size:1.0625rem} .rail .btn{font-size:1.0625rem} .rail .quote,.rail .story,.rail .conn{font-size:1rem;line-height:1.5}

.quote{font-weight:700;line-height:1.4;border-left:4px solid var(--spine);padding-left:10px}
.story{line-height:1.45;margin:0}
.chip{align-self:flex-start;border:2px solid var(--strong);border-radius:999px;padding:3px 12px;font-weight:700;font-size:16px;line-height:1.3}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.no{border-color:var(--no);color:var(--no)}
.src{color:var(--muted);font-size:13px;line-height:1.4}
.conn{border-top:1px solid var(--line);padding-top:8px;line-height:1.4}
.conn b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.vermerk{font-size:13px;color:var(--muted);font-style:italic}

.route{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:34px}
.route::before{content:"";position:absolute;left:10px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--line)}
.stop{position:relative;line-height:1.3}
.stop b{font-family:var(--display);font-weight:500}
.stop small{display:block;color:var(--muted)}
.pin{position:absolute;left:-33px;top:1px;width:22px;height:22px;border-radius:50%;border:3px solid var(--spine);background:var(--bg)}
.pin.hit{background:var(--spine)}
.pin.split{background:linear-gradient(90deg,var(--spine) 0 50%,var(--bg) 50% 100%)}
.pin.torn{border-radius:3px;transform:rotate(45deg) scale(.82)}
.pin.next{background:var(--accent);border-color:var(--plate-edge)}
.pin.todo{border-color:var(--line)}
.pin.skip{border-style:dashed;border-color:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px;line-height:1.4}
.legend span{position:relative;padding-left:20px}
.legend .pin{left:0;top:2px;width:13px;height:13px;border-width:2px}
.idle{background:var(--idle-bg);color:var(--idle-fg)}
.idle .meta,.idle .stop small,.idle .legend{color:var(--idle-muted)}
.idle .pin{background:var(--idle-bg)} .idle .pin.hit{background:var(--spine)} .idle .pin.next{background:var(--accent)}
.idle .stop{font-size:18px} .idle .next-line{font-size:22px;font-family:var(--display);line-height:1.3}

.rungs{display:flex;flex-direction:column;gap:8px}
.rung{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 14px;line-height:1.3;color:var(--muted)}
.auto .rung{font-size:20px}
.rung.yes{color:var(--fg);border-color:var(--spine)}
.rung.now{color:var(--fg);border-color:var(--strong);background:var(--surface);font-weight:700}
.rung span{font-size:15px;font-weight:600}

.choice{display:flex;flex-direction:column;gap:8px}
.choice .opt{min-height:64px}
.choice .opt small{display:block;color:var(--muted);font-size:13px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tally div{border:2px solid var(--line);border-radius:12px;padding:8px 4px}
.tally b{display:block;font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.2}
.tally span{font-size:.75rem;color:var(--muted)}
.list{line-height:1.5;font-size:.95rem}
.list div{display:flex;gap:8px} .list i{font-style:normal;width:1.2em;text-align:center}
.note{font-size:12px;color:var(--muted);line-height:1.4}
textarea{width:100%;min-height:90px;font:inherit;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:8px}
@media (prefers-reduced-motion:no-preference){ .scr.in{animation:up .18s ease-out} }
@keyframes up{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
</style>
</head>
<body>
<div class="stage">

  <!-- S1/S3 Start: Raum und Situation -->
  <section class="scr rail" id="s-start">
    <div class="top"><span class="sp">Feldtest-Prototyp · Spielkonzept v0.2.8</span><button id="theme">System</button></div>
    <div class="plate" style="font-size:1.6rem">QuizAway</div>
    <p class="meta">Ein Ort wird zum Spielort. Erst die eigene Theorie, dann die Geschichte. Ankommen am Ort wird mit „Jetzt“ simuliert.</p>
    <b>Strecke</b>
    <div class="choice" id="raeume"></div>
    <b>Situation</b>
    <div class="choice" id="modi">
      <button class="opt" data-modus="auto" aria-pressed="true"><span class="k">A</span><span>Auto, Gruppe<small>Beifahrer liest vor, alle rufen 1–4; gespalten und uneinig möglich</small></span></button>
      <button class="opt" data-modus="solo" aria-pressed="false"><span class="k">S</span><span>Bahn, solo<small>eigenes Tempo, festlegen, dann auflösen</small></span></button>
    </div>
    <div class="grow"></div>
    <div class="bar"><button class="btn primary" id="starten">Fahrt starten</button></div>
    <div class="bar" id="bar-weiter" hidden><button class="btn" id="weiter">Fahrt fortsetzen</button></div>
    <div class="note" id="vorrat-info"></div>
  </section>

  <!-- S4/S7 Fahrtkarte -->
  <section class="scr" id="s-karte" hidden>
    <div class="top"><span class="sp" id="k-zaehler"></span><button id="k-menue">Menü</button></div>
    <div class="route grow" id="k-route"></div>
    <div class="legend"><span><i class="pin hit"></i>Treffer</span><span><i class="pin"></i>daneben</span><span><i class="pin split"></i>gespalten</span><span><i class="pin torn"></i>uneinig</span></div>
    <div class="bar"><button class="btn primary" id="k-jetzt">Jetzt</button></div>
    <div class="bar"><button class="btn small quiet" id="k-skip" style="flex:1">Ort überspringen</button><button class="btn small quiet" id="k-ende" style="flex:1">Fahrt abschließen</button></div>
  </section>

  <!-- S5/S8 Frage -->
  <section class="scr" id="s-frage" hidden>
    <div class="plate" id="f-ort"></div>
    <div class="meta" id="f-steck"></div>
    <h1 class="q" id="f-frage"></h1>
    <div class="hint" id="f-hint"></div>
    <div class="opts" id="f-opts"></div>
    <div class="grow"></div>
    <div class="bar" id="f-bar-leer"><button class="btn quiet" id="f-gleich">Gleich</button><button class="btn" id="f-uneinig">uneinig</button></div>
    <div class="bar" id="f-bar-wahl" hidden><button class="btn primary" id="f-aufloesen">Auflösen</button></div>
  </section>

  <!-- SL Leiter -->
  <section class="scr" id="s-leiter" hidden>
    <div class="plate" id="l-ort"></div>
    <div class="meta" id="l-steck"></div>
    <h1 class="q" id="l-frage"></h1>
    <div class="rungs" id="l-rungs"></div>
    <div class="grow"></div>
    <div class="bar"><button class="btn" id="l-hoeher">höher</button><button class="btn primary" id="l-raus">hier steige ich aus</button></div>
  </section>

  <!-- S6 Auflösung -->
  <section class="scr" id="s-aufl" hidden>
    <div class="plate" id="a-ort"></div>
    <div class="quote" id="a-zitat"></div>
    <p class="story" id="a-text"></p>
    <div class="chip" id="a-urteil"></div>
    <div class="src" id="a-quelle"></div>
    <div class="vermerk" id="a-vermerk" hidden></div>
    <div class="conn" id="a-anschluss" hidden><b>Anschluss</b><span id="a-anschluss-text"></span></div>
    <div class="grow"></div>
    <div class="bar"><button class="btn" id="a-zu">Zur Fahrtkarte</button></div>
  </section>

  <!-- S10 Fahrtende -->
  <section class="scr rail" id="s-ende" hidden>
    <div class="plate" id="e-titel"></div>
    <div class="meta" id="e-meta"></div>
    <div class="tally"><div><b id="e-orte">0</b><span>gespielt</span></div><div><b id="e-treffer">0</b><span>Treffer</span></div><div><b id="e-daneben">0</b><span>daneben</span></div></div>
    <div class="list" id="e-liste"></div>
    <b>Notiz zum Feldtest</b>
    <textarea id="e-notiz" placeholder="Was ist aufgefallen? Wo wurde gelacht, wo abgeschaltet?"></textarea>
    <div class="grow"></div>
    <div class="bar"><button class="btn" id="e-protokoll">Protokoll kopieren</button><button class="btn primary" id="e-neu">Neue Fahrt</button></div>
    <div class="note" id="e-hinweis"></div>
    <textarea id="e-protokoll-text" readonly hidden aria-label="Protokoll der Fahrt"></textarea>
  </section>

</div>

<script src="daten.js"></script>
<script>
(function(){
  'use strict';
  var D = window.QA_DATEN, $ = function(id){ return document.getElementById(id); };
  var IDS = ['s-start','s-karte','s-frage','s-leiter','s-aufl','s-ende'];
  var MUSTER = ['A','C','A','B','Leiter','A','B','A','B','A','C'];   // gemischte Reihe des Kartensatzes für den Tisch
  var ZIFFER = {1:'eins',2:'zwo',3:'drei',4:'vier'};

  // ---- Speicher (nur Komfort; die Seite läuft auch ohne) ----
  function laden(k, leer){ try{ var v = localStorage.getItem('qa-'+k); return v ? JSON.parse(v) : leer; }catch(e){ return leer; } }
  function sichern(k, v){ try{ localStorage.setItem('qa-'+k, JSON.stringify(v)); }catch(e){} }

  var fahrt = laden('fahrt', null);         // laufende Fahrt
  var gespielt = laden('gespielt', {});     // je Raum: Liste gespielter Karten-IDs (über Fahrten hinweg)
  var modus = 'auto', raumId = D.raeume[0].id;

  function raum(){ return D.raeume.filter(function(r){ return r.id === fahrt.raum; })[0]; }
  function show(id){
    IDS.forEach(function(x){ $(x).hidden = (x !== id); $(x).classList.remove('in'); });
    var s = $(id); s.classList.add('in'); s.scrollTop = 0;
    if(id !== 's-start' && id !== 's-ende'){ s.classList.toggle('auto', fahrt.modus === 'auto'); s.classList.toggle('rail', fahrt.modus !== 'auto'); }
    if(id === 's-karte') s.classList.toggle('idle', fahrt.modus === 'auto');
  }

  // ---- Hell / Dunkel / System ----
  var modes = ['System','Hell','Dunkel'], m = laden('theme', 0);
  function thema(){ var r = document.documentElement; if(m === 0) r.removeAttribute('data-theme'); else r.setAttribute('data-theme', m === 1 ? 'light' : 'dark'); $('theme').textContent = modes[m]; }
  $('theme').onclick = function(){ m = (m + 1) % 3; sichern('theme', m); thema(); };
  thema();

  // ---- Start ----
  function startZeichnen(){
    $('raeume').innerHTML = '';
    D.raeume.forEach(function(r, i){
      var n = r.orte.reduce(function(s, o){ return s + o.karten.length; }, 0);
      var b = document.createElement('button');
      b.className = 'opt'; b.setAttribute('aria-pressed', r.id === raumId ? 'true' : 'false');
      b.innerHTML = '<span class="k">' + (i + 1) + '</span><span>' + r.name + '<small>' + r.orte.length + ' Orte · ' + n + ' Karten im Vorrat · ' +
        ((gespielt[r.id] || []).length) + ' schon gespielt</small></span>';
      b.onclick = function(){ raumId = r.id; startZeichnen(); };
      $('raeume').appendChild(b);
    });
    document.querySelectorAll('#modi .opt').forEach(function(b){
      b.setAttribute('aria-pressed', b.dataset.modus === modus ? 'true' : 'false');
      b.onclick = function(){ modus = b.dataset.modus; startZeichnen(); };
    });
    $('bar-weiter').hidden = !(fahrt && !fahrt.ende);
    $('vorrat-info').textContent = 'Karten aus dem geprüften Vorrat (Faktencheck). Gespielte Karten kommen erst wieder, wenn ein Ort alle durch hat.';
  }
  $('starten').onclick = function(){
    var r = D.raeume.filter(function(x){ return x.id === raumId; })[0];
    fahrt = { raum: raumId, modus: modus, start: new Date().toISOString(), pos: 0, orte: r.orte.map(function(o){ return { slug: o.slug, status: 'todo' }; }), log: [] };
    sichern('fahrt', fahrt); karteZeichnen(); show('s-karte');
  };
  $('weiter').onclick = function(){ karteZeichnen(); show('s-karte'); };

  // ---- Fahrtkarte ----
  function ortVon(slug){ return raum().orte.filter(function(o){ return o.slug === slug; })[0]; }
  function karteZeichnen(){
    var r = raum(), h = '', pos = fahrt.pos;
    $('k-zaehler').textContent = (pos < r.orte.length ? 'Ort ' + (pos + 1) + ' von ' + r.orte.length : 'Alle Orte gespielt') + ' · ' + r.name;
    fahrt.orte.forEach(function(f, i){
      var o = ortVon(f.slug), cls = f.status;
      if(i === pos) {
        var km = o.km_vom_vorigen ? ' · ' + String(o.km_vom_vorigen).replace('.', ',') + ' km' : '';
        h += '<div class="stop"><i class="pin next"></i><span class="next-line">Nächster Ort: <b>' + o.name + '</b>' + km + '</span></div>';
      } else {
        h += '<div class="stop"><i class="pin ' + (cls === 'todo' ? 'todo' : cls) + '"></i><b>' + o.name + '</b>' +
             (f.kurz ? '<small>' + f.kurz + '</small>' : '') + '</div>';
      }
    });
    $('k-route').innerHTML = h;
    var fertig = pos >= r.orte.length;
    $('k-jetzt').disabled = fertig; $('k-skip').disabled = fertig;
    $('k-jetzt').textContent = fertig ? 'Fahrt zu Ende' : (fahrt.modus === 'auto' ? 'Jetzt' : 'Nächster Ort: ' + ortVon(fahrt.orte[pos].slug).name + ' — Frage starten');
  }
  $('k-jetzt').onclick = function(){ frageStarten(); };
  $('k-skip').onclick = function(){ fahrt.orte[fahrt.pos].status = 'skip'; fahrt.pos++; sichern('fahrt', fahrt); karteZeichnen(); };
  $('k-ende').onclick = function(){ endeZeigen(); };
  $('k-menue').onclick = function(){ startZeichnen(); show('s-start'); };

  // ---- Karte wählen: erste Fahrt = Tisch-Reihe, sonst Muster, Varianz, ungespielt ----
  function karteWaehlen(o){
    var g = gespielt[fahrt.raum] || [], frei = o.karten.filter(function(k){ return g.indexOf(k.id) < 0; });
    if(!frei.length){ gespielt[fahrt.raum] = g.filter(function(id){ return id.indexOf(o.slug + '/') !== 0; }); frei = o.karten.slice(); }
    var tisch = frei.filter(function(k){ return k.tisch; });
    if(tisch.length) return tisch[0];
    var letzte = fahrt.log.length ? fahrt.log[fahrt.log.length - 1].familie : null;
    var wunsch = MUSTER[fahrt.pos % MUSTER.length];
    var passt = frei.filter(function(k){ return k.familie === wunsch && k.familie !== letzte; });
    if(!passt.length) passt = frei.filter(function(k){ return k.familie !== letzte; });
    if(!passt.length) passt = frei;
    return passt[Math.floor(Math.random() * passt.length)];
  }

  var aktuell = null, wahl = [], t0 = 0, stufe = 0;
  function frageStarten(){
    var o = ortVon(fahrt.orte[fahrt.pos].slug), k = karteWaehlen(o);
    aktuell = { ort: o, karte: k }; wahl = []; t0 = Date.now(); stufe = 0;
    if(k.art === 'leiter'){ show('s-leiter'); leiterZeichnen(); return; }
    $('f-ort').textContent = o.name; $('f-steck').textContent = k.steckbrief; $('f-frage').textContent = k.frage;
    $('f-hint').textContent = fahrt.modus === 'auto' ? '3 – 2 – 1, alle rufen: ' + k.optionen.map(function(_, i){ return ZIFFER[i + 1]; }).join(', ') + '.' : (k.art === 'luege' ? 'Tippe auf die Aussage, die du für gelogen hältst.' : '');
    var h = '';
    k.optionen.forEach(function(t, i){ h += '<button class="opt" aria-pressed="false" data-n="' + (i + 1) + '"><span class="k">' + (i + 1) + '</span><span>' + t + '</span></button>'; });
    $('f-opts').innerHTML = h;
    document.querySelectorAll('#f-opts .opt').forEach(function(b){ b.onclick = function(){ waehlen(b.dataset.n); }; });
    $('f-gleich').textContent = fahrt.modus === 'auto' ? 'Gleich' : 'Zurück';
    $('f-uneinig').hidden = fahrt.modus !== 'auto';
    $('f-aufloesen').textContent = fahrt.modus === 'auto' ? 'Auflösen' : 'Festlegen';
    balken(); show('s-frage'); einpassen('s-frage');
  }
  // Im Auto soll nichts gescrollt werden (UI-Konzept v0.2, KU7): Kacheln bleiben bei 72 px; zu lange Fragen
  // verkleinern erst die Fragenschrift (bis 19 px), dann entfällt die 3-2-1-Zeile, zuletzt der Steckbrief.
  function einpassen(id){
    var s = $(id), q = s.querySelector('.q'), hint = s.querySelector('.hint'), meta = s.querySelector('.meta');
    q.style.fontSize = ''; if(hint) hint.hidden = false; if(meta) meta.hidden = false;
    if(fahrt.modus !== 'auto') return;
    var px = 24;
    while(s.scrollHeight > s.clientHeight && px > 19){ px--; q.style.fontSize = px + 'px'; }
    if(s.scrollHeight > s.clientHeight && hint) hint.hidden = true;
    if(s.scrollHeight > s.clientHeight && meta) meta.hidden = true;
  }
  function waehlen(n){
    var i = wahl.indexOf(n);
    if(i >= 0) wahl.splice(i, 1);
    else if(fahrt.modus === 'auto'){ if(wahl.length === 2) wahl.shift(); wahl.push(n); }
    else wahl = [n];
    document.querySelectorAll('#f-opts .opt').forEach(function(b){ b.setAttribute('aria-pressed', wahl.indexOf(b.dataset.n) >= 0 ? 'true' : 'false'); });
    balken();
  }
  function balken(){ $('f-bar-leer').hidden = wahl.length > 0; $('f-bar-wahl').hidden = wahl.length === 0; }
  $('f-gleich').onclick = function(){ karteZeichnen(); show('s-karte'); };
  $('f-uneinig').onclick = function(){ aufloesen('torn', 'Ihr wart euch uneinig.', null); };
  $('f-aufloesen').onclick = function(){
    var k = aktuell.karte, wer = fahrt.modus === 'auto' ? 'Eure' : 'Deine';
    if(wahl.length === 2){
      var gs = wahl.slice().sort();
      aufloesen('split', 'Ihr wart gespalten: ' + gs.join(' gegen ') + '.', gs.map(Number));
    } else {
      var n = Number(wahl[0]);
      aufloesen(n === k.loesung ? 'hit' : 'miss', wer + ' Theorie: ' + n + ' — ' + k.optionen[n - 1], [n]);
    }
  };

  // ---- Leiter ----
  function leiterZeichnen(){
    var o = aktuell.ort, k = aktuell.karte;
    $('l-ort').textContent = o.name; $('l-steck').textContent = k.steckbrief; $('l-frage').textContent = k.frage;
    var h = '';
    k.optionen.forEach(function(t, i){ h += '<div class="rung' + (i < stufe ? ' yes' : '') + (i === stufe ? ' now' : '') + '">' + t + '<span>' + (i < stufe ? 'höher' : '') + '</span></div>'; });
    $('l-rungs').innerHTML = h;
    einpassen('s-leiter');
  }
  $('l-hoeher').onclick = function(){ stufe++; if(stufe >= aktuell.karte.optionen.length) leiterEnde(); else leiterZeichnen(); };
  $('l-raus').onclick = leiterEnde;
  function leiterEnde(){
    var k = aktuell.karte, wer = fahrt.modus === 'auto' ? 'Ihr seid' : 'Du bist';
    var z = stufe === 0 ? wer + ' gleich bei der ersten Stufe ausgestiegen.' :
            stufe >= k.optionen.length ? wer + ' bis über die letzte Stufe gegangen.' :
            wer + ' nach Stufe ' + stufe + ' ausgestiegen.';
    aufloesen(stufe === k.loesung ? 'hit' : 'miss', z, [stufe]);
  }

  // ---- Auflösung ----
  function geschichte(k){
    // Der Platzhalter-Satz entfällt (die Theorie steht oben als Zitat); der Schlusssatz wird zum Urteil-Chip.
    return k.rueckseite.replace(/^Du hattest \[Option\] getippt\.\s*/, '')
      .replace(/\s*(Richtig war \d\.|Die Lüge war \d\.|Höher bis Stufe \d, dann raus\.)\s*$/, '');
  }
  function urteilText(k){
    return k.art === 'luege' ? 'Die Lüge war ' + k.loesung + '.' : k.art === 'leiter' ? 'Höher bis Stufe ' + k.loesung + ', dann raus.' : 'Richtig war ' + k.loesung + '.';
  }
  function aufloesen(status, zitat, antwort){
    var o = aktuell.ort, k = aktuell.karte, f = fahrt.orte[fahrt.pos];
    var vorige = fahrt.log.length ? fahrt.log[fahrt.log.length - 1].ort : null;
    f.status = status; f.kurz = k.familie === 'Leiter' ? 'Leiter' : (status === 'hit' ? 'Treffer' : status === 'split' ? 'gespalten' : status === 'torn' ? 'uneinig' : 'daneben');
    $('a-ort').textContent = o.name; $('a-zitat').textContent = zitat; $('a-text').textContent = geschichte(k);
    var chip = $('a-urteil');
    chip.className = 'chip ' + (status === 'hit' ? 'ok' : (status === 'miss' ? 'no' : ''));
    chip.textContent = (status === 'hit' ? 'Treffer · ' : status === 'miss' ? 'Daneben · ' : '') + urteilText(k);
    $('a-quelle').textContent = 'Quelle: ' + k.quelle;
    $('a-vermerk').hidden = k.faktencheck !== 'unsicher';
    $('a-vermerk').textContent = 'Faktencheck: unsicher – belegt nur durch eine Quelle.';
    // Anschluss nur, wenn der davor gespielte Ort der Ort ist, auf den sich der Anschluss bezieht (er hängt am Ortspaar)
    var an = (vorige && vorige === o.anschluss_von && o.anschluss.length) ? o.anschluss[0] : '';
    $('a-anschluss').hidden = !an; $('a-anschluss-text').textContent = an;
    fahrt.log.push({ ort: o.slug, name: o.name, karte: k.id, familie: k.familie, sorte: k.sorte, status: status, antwort: antwort,
                     loesung: k.loesung, sekunden: Math.round((Date.now() - t0) / 1000), anschluss: !!an, zeit: new Date().toISOString() });
    (gespielt[fahrt.raum] = gespielt[fahrt.raum] || []).push(k.id);
    fahrt.pos++; sichern('fahrt', fahrt); sichern('gespielt', gespielt);
    $('a-zu').textContent = fahrt.pos >= fahrt.orte.length ? 'Zum Fahrtende' : 'Zur Fahrtkarte';
    show('s-aufl');
  }
  $('a-zu').onclick = function(){ if(fahrt.pos >= fahrt.orte.length) endeZeigen(); else { karteZeichnen(); show('s-karte'); } };

  // ---- Fahrtende und Protokoll ----
  function endeZeigen(){
    var r = raum(), log = fahrt.log;
    fahrt.ende = fahrt.ende || new Date().toISOString(); sichern('fahrt', fahrt);
    $('e-titel').textContent = r.orte[0].name + ' – ' + r.orte[r.orte.length - 1].name;
    $('e-meta').textContent = r.name + ' · ' + (fahrt.modus === 'auto' ? 'Auto, Gruppe' : 'Bahn, solo');
    $('e-orte').textContent = log.length;
    $('e-treffer').textContent = log.filter(function(l){ return l.status === 'hit'; }).length;
    $('e-daneben').textContent = log.filter(function(l){ return l.status === 'miss'; }).length;
    $('e-liste').innerHTML = log.map(function(l){
      var z = { hit: '✓', miss: '✗', split: '½', torn: '?' }[l.status];
      return '<div><i>' + z + '</i><span>' + l.name + ' · Familie ' + l.familie + ' · ' + l.sekunden + ' s</span></div>';
    }).join('');
    $('e-notiz').value = fahrt.notiz || '';
    $('e-hinweis').textContent = '';
    show('s-ende');
  }
  $('e-notiz').oninput = function(){ fahrt.notiz = this.value; sichern('fahrt', fahrt); };
  $('e-protokoll').onclick = function(){
    var text = JSON.stringify({ prototyp: 'quizaway-reise 0.1', raum: fahrt.raum, modus: fahrt.modus, start: fahrt.start, ende: fahrt.ende,
                                notiz: fahrt.notiz || '', orte: fahrt.log }, null, 1);
    var ok = function(){ $('e-hinweis').textContent = 'Protokoll in der Zwischenablage – bitte in den Feldtest-Bogen oder an Claude geben.'; };
    // Ohne Zwischenablage (manche App-Ansichten verweigern sie): Protokoll zum Markieren und Kopieren zeigen
    var zeigen = function(){ var t = $('e-protokoll-text'); t.hidden = false; t.value = text; t.focus(); t.select();
      $('e-hinweis').textContent = 'Kopieren hier nicht möglich – das Protokoll steht markiert im Feld unten.'; };
    try{ navigator.clipboard.writeText(text).then(ok, zeigen); }catch(e){ zeigen(); }
  };
  $('e-neu').onclick = function(){ fahrt = null; sichern('fahrt', null); startZeichnen(); show('s-start'); };

  // Bildschirm anlassen (im Auto)
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){}
  document.addEventListener('visibilitychange', function(){ try{ if(!document.hidden && navigator.wakeLock) navigator.wakeLock.request('screen').catch(function(){}); }catch(e){} });

  startZeichnen(); show('s-start');
})();
</script>
