services:
  - type: web
    name: quizaway
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/sync/rendezvous.py --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false  # wird manuell im Render-Dashboard gesetzt

  - type: web
    name: duellmaschine
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: bash -c "cd scripts/sync && python duellmaschine.py"
    envVars:
      - key: PORT
        value: 10000
